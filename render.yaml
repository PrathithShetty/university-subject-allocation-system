databases:
  - name: subject-allocation-db
    plan: free
    databaseName: subject_allocation
    user: subject_allocation

services:
  - type: web
    name: subject-allocation-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements/production.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && python manage.py ensure_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: subject-allocation-db
          property: connectionString
      # Set this after you know your Vercel URL, e.g.
      # https://your-project.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # First admin login created automatically on first deploy - set
      # these to whatever you want, then you can change the password
      # later from inside the app.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
